        <script>
            class Clock
            {
                constructor(element)
                {
                    this.element = element;
                    this.seconds = 0;
                    this.timer = null;
                }

                startCount()
                {
                    // Dừng bộ đếm cũ
                    clearInterval(this.timer);

                    // Reset
                    this.seconds = 0;
                    this.update();

                    // Bắt đầu đếm
                    this.timer = setInterval(() =>
                    {
                        this.seconds++;
                        this.update();
                    }, 1000);
                }

                update()
                {
                    const hours = Math.floor(this.seconds / 3600);
                    const minutes = Math.floor((this.seconds % 3600) / 60);
                    const seconds = this.seconds % 60;

                    this.element.innerText =
                        String(hours).padStart(2, '0') + ':' +
                        String(minutes).padStart(2, '0') + ':' +
                        String(seconds).padStart(2, '0');
                }

                stop()
                {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            }

            const clock = new Clock(document.getElementById('clock'));
        </script>

<script>


    /* =========================================================
       AVATAR
       ========================================================= */

    function dichChuyenAvatar()
    {
        const avatar = document.getElementById('avatar');

        if (!avatar)
            return;


        const w = window.innerWidth;
        const h = window.innerHeight;

        const aw = avatar.offsetWidth;
        const ah = avatar.offsetHeight;


        const random = (min, max) =>
            Math.random() * (max - min) + min;


        const canhPhai = Math.random() < 0.5;


        if (canhPhai)
        {
            const right = random(-5, 5);

            const top = random(0, h - ah);

            avatar.style.right = `${right}px`;
            avatar.style.top = `${top}px`;

            avatar.style.left = 'auto';
            avatar.style.bottom = 'auto';
        }
        else
        {
            const top = random(-5, 5);

            const right = random(0, w/2 - aw);

            avatar.style.top = `${top}px`;
            avatar.style.right = `${right}px`;

            avatar.style.left = 'auto';
            avatar.style.bottom = 'auto';
        }
    }


    dichChuyenAvatar();

    setInterval(dichChuyenAvatar, 30000);



    /* =========================================================
       TAB EDITOR CHÍNH
       ========================================================= */

    function showTab(id)
    {
        const htmlInput = document.getElementById('htmlInput');
        const cssInput = document.getElementById('cssInput');
        const jsInput = document.getElementById('jsInput');

        const htmlButton = document.getElementById('htmlButton');
        const cssButton = document.getElementById('cssButton');
        const jsButton = document.getElementById('jsButton');


        switch (id)
        {
            case 'html':

                htmlInput.classList.remove('hidden');
                cssInput.classList.add('hidden');
                jsInput.classList.add('hidden');

                htmlButton.classList.add('button-active');
                cssButton.classList.remove('button-active');
                jsButton.classList.remove('button-active');

                break;


            case 'css':

                htmlInput.classList.add('hidden');
                cssInput.classList.remove('hidden');
                jsInput.classList.add('hidden');

                htmlButton.classList.remove('button-active');
                cssButton.classList.add('button-active');
                jsButton.classList.remove('button-active');

                break;


            case 'js':

                htmlInput.classList.add('hidden');
                cssInput.classList.add('hidden');
                jsInput.classList.remove('hidden');

                htmlButton.classList.remove('button-active');
                cssButton.classList.remove('button-active');
                jsButton.classList.add('button-active');

                break;
        }
    }

    function load()

        const js = document.getElementById('jsInput').value;


        const code = `
        <!DOCTYPE html>

        <html>

            <head>

                <style>

                    ${css}

                </style>

            </head>


            <body>

                ${html}


                <script>

                    ${js.replace(/<\/script/gi, '<\\/script')}

                <\/script>

            </body>

        </html>
        `;


        document.getElementById('view').srcdoc = code;
    }

    /* =========================================================
       LOCAL STORAGE
       ========================================================= */

    function saveInput(input)
    {
        localStorage.setItem(
            input.id,
            input.value
        );
    }



    function loadSavedInputs()
    {
        const inputs = document.querySelectorAll('textarea');


        inputs.forEach(function(input)
        {
            const saved = localStorage.getItem(input.id);


            if (saved !== null)
            {
                input.value = saved;
            }


            /*
             * Lưu khi người dùng gõ.
             */
            input.addEventListener(
                'keyup',
                function()
                {
                    saveInput(input);
                }
            );


            /*
             * Lưu luôn khi paste / input bằng cách khác.
             * Không ảnh hưởng yêu cầu onkeyup.
             */
            input.addEventListener(
                'input',
                function()
                {
                    saveInput(input);
                }
            );
        });
    }



    /* =========================================================
       CLEAR INPUT2
       ========================================================= */

    function clearInput2()
    {
        const ids =
        [
            'htmlInput2',
            'cssInput2',
            'jsInput2'
        ];


        ids.forEach(function(id)
        {
            const input = document.getElementById(id);


            if (input)
            {
                input.value = '';

                localStorage.removeItem(id);
            }
        });


        showTab2('html');
    }



    document
        .getElementById('clear')
        .addEventListener(
            'click',
            clearInput2
        );



    /* =========================================================
       COMPONENT BUILDER
       ========================================================= */

    function appendCode(id, code)
    {
        const input = document.getElementById(id);


        if (!input)
            return;


        /*
         * Nếu đang có nội dung thì thêm xuống dòng
         * trước component mới.
         */

        if (input.value.length > 0)
        {
            input.value += '\n\n';
        }


        input.value += code;


        /*
         * Lưu ngay vào localStorage.
         */

        saveInput(input);


        /*
         * Đưa cursor về cuối.
         */

        input.focus();

        input.selectionStart = input.value.length;

        input.selectionEnd = input.value.length;


        /*
         * Cuộn xuống cuối.
         */

        input.scrollTop = input.scrollHeight;
    }

    let typingRunId = 0;

    function runNow()
    {
        clock.startCount();
        document.getElementById('control').style.display='none';
        document
            .getElementById('view')
            .srcdoc = '';
        window.scrollTo(
        {
            top: 0,
            behavior: 'smooth'
        });


        const runId = ++typingRunId;


        /*
         * Lấy code từ 3 ô Input2
         */

        const htmlCode =
            document
                .getElementById('htmlInput2')
                .value;


        const cssCode =
            document
                .getElementById('cssInput2')
                .value;


        const jsCode =
            document
                .getElementById('jsInput2')
                .value;



        /*
         * Xóa code cũ ở các ô chính
         */

        document
            .getElementById('htmlInput')
            .value = '';


        document
            .getElementById('cssInput')
            .value = '';


        document
            .getElementById('jsInput')
            .value = '';



        /*
         * Sau 3 giây mới bắt đầu gõ
         */

        setTimeout(
            async function()
            {
                if (runId !== typingRunId)
                    return;


                await typeCode(
                    'htmlInput',
                    htmlCode,
                    runId
                );


                if (runId !== typingRunId)
                    return;


                await typeCode(
                    'cssInput',
                    cssCode,
                    runId
                );


                if (runId !== typingRunId)
                    return;


                await typeCode(
                    'jsInput',
                    jsCode,
                    runId
                );

                setTimeout(function(){showTab('html');},800);
                clock.stop();                        
            },
            3000
        );
    }

    
    document
        .getElementById('runTest')
        .addEventListener(
            'click',
            function()
            {
                document.getElementById('clock').style.display = 'block';
                runNow();
            }
        );

    document
        .getElementById('run')
        .addEventListener(
            'click',
            function()
            {
                document.getElementById('clock').style.display = 'none';
                runNow();
            }
        );



    /* =========================================================
       TYPE CODE
       ========================================================= */

    async function typeCode(
        inputId,
        code,
        runId
    )
    {
        if (!code.trim()) return;
        const input =
            document.getElementById(inputId);
        
        let id2 =
            inputId.slice(
                0,
                inputId.length - 5
            );


        await sleep(
            random(1000, 2000)
        );


        showTab(id2);


        await sleep(
            random(1000, 2000)
        );



        for (
            let i = 0;
            i < code.length;
            i++
        )
        {

            /*
             * Run mới => dừng ngay
             */

            if (runId !== typingRunId)
                return;


            const kyTuDung = code[i];


            /*
             * Khoảng nghỉ ngẫu nhiên.
             */

            let delay =
                random(50, 150);


            if (kyTuDung === '\n')
            {
                delay =
                    random(600, 1600);
            }

            else if (kyTuDung === ' ')
            {
                delay =
                    random(60, 180);
            }

            else if (
                '{}[]();=<>:"\'`'.includes(
                    kyTuDung
                )
            )
            {
                delay =
                    random(160, 480);
            }



            /*
             * Thỉnh thoảng dừng lại suy nghĩ.
             */

            if (Math.random() < 0.025)
            {
                await sleep(
                    random(1000, 1900)
                );
            }



            /*
             * Có xác suất gõ sai.
             */

            if (
                Math.random() < 0.035 &&
                isMistakeCandidate(kyTuDung)
            )
            {
                const kyTuSai =
                    randomWrongCharacter(
                        kyTuDung
                    );


                input.value += kyTuSai;

                updateCursor(input);


                await sleep(
                    random(300, 600)
                );


                /*
                 * Nhận ra gõ sai -> Backspace
                 */

                input.value =
                    input.value.slice(0, -1);


                updateCursor(input);


                await sleep(
                    random(200, 480)
                );


                /*
                 * Gõ lại đúng
                 */

                input.value += kyTuDung;

                updateCursor(input);

            }
            else
            {
                input.value += kyTuDung;

                updateCursor(input);
            }



            /*
             * Lưu editor chính vào localStorage
             */

            saveInput(input);


            /*
             * Cập nhật iframe
             */

            load();


            await sleep(delay);
        }
    }



    /* =========================================================
       MISTAKE
       ========================================================= */

    function isMistakeCandidate(char)
    {
        return /[a-zA-Z0-9]/.test(char);
    }



    function randomWrongCharacter(char)
    {
        const lower =
            'abcdefghijklmnopqrstuvwxyz';


        const upper =
            'ABCDEFGHIJKLMNOPQRSTUVWXYZ';


        const number =
            '0123456789';


        let source;


        if (/[a-z]/.test(char))
        {
            source = lower;
        }

        else if (/[A-Z]/.test(char))
        {
            source = upper;
        }

        else if (/[0-9]/.test(char))
        {
            source = number;
        }

        else
        {
            return char;
        }


        let wrong;


        do
        {
            wrong =
                source[
                    Math.floor(
                        Math.random() *
                        source.length
                    )
                ];

        }
        while (wrong === char);


        return wrong;
    }



    /* =========================================================
       CURSOR
       ========================================================= */

    function updateCursor(input)
    {
        input.selectionStart =
            input.value.length;


        input.selectionEnd =
            input.value.length;


        input.scrollTop =
            input.scrollHeight;
    }



    /* =========================================================
       DELAY
       ========================================================= */

    function sleep(ms)
    {
        return new Promise(
            function(resolve)
            {
                setTimeout(
                    resolve,
                    ms
                );
            }
        );
    }



    /* =========================================================
       RANDOM
       ========================================================= */

    function random(min, max)
    {
        return Math.floor(
            Math.random() *
            (max - min + 1)
        ) + min;
    }



    /* =========================================================
       KHỞI TẠO LOCAL STORAGE
       ========================================================= */

    loadSavedInputs();


    /*
     * Sau khi khôi phục dữ liệu localStorage,
     * render preview lại.
     */

    load();


</script>
