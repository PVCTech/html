<!DOCTYPE html>
<html>
<head>
    <title>PVC HTML code</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="index_files/style.css">
</head>


<body style="box-sizing: border-box;background: rgba(0,0,0,0.05)">
    <div class="avatar" id="avatar" onclick="document.getElementById('control').style.display='block';">
        <div style="width: 100%; height: 100%; position: relative;">
            <img src="avatar.gif" style="position: absolute; top: -20px; left: -20px; width:150%; height:150%;">
        </div>
    </div>

    <div style="display:grid; grid-template-rows: 30px 24px 24px 30vh 28px auto 28px auto; height:85vh;
        padding: 20px 12px 0px 12px;">
        <div style="width:100%; padding:4px;text-align: center;" id="screen_view_caption" onclick="dichChuyenAvatar();">
            HTML code
        </div>
        <div style="width:100%; padding:4px;display: flex; flex-direction:row; gap:12px;">
            <div>PVC Free web</div>
            <div id="clock">00:00:00</div>
        </div>

        <div class="preview-tabs" style="width:100%; padding:2px 2px 0px 2px; position:relative;
            border-radius: 6px 6px 0px 0px; background: rgba(255,255,255,0.5); border: 1px solid rgba(0,0,0,0.1);">
            <div class="tab__button tab__button-active" style="position:absolute; bottom:1px; left:0px; z-index:3;" id="htmlButton" onclick="showTab('html')">
                <div style="width:10px; height:10px; background:orange;"></div>
                HTML
            </div>
            <div class="tab__button" style="position:absolute; bottom:1px; left:90px; z-index: 3;" id="cssButton" onclick="showTab('css')">
                <div style="width:10px; height:10px; background:green;"></div>
                CSS
            </div>
            <div class="tab__button" style="position:absolute; bottom:1px; left:180px; z-index:3;" id="jsButton" onclick="showTab('js')">
                <div style="width:10px; height:10px; background:red;"></div>
                JS
            </div>
        </div>
        <div class="input code-screen" id="htmlInput_screen"></div>
        <div class="input code-screen hidden" id="cssInput_screen"></div>
        <div class="input code-screen hidden" id="jsInput_screen"></div>

        <textarea class="input hidden" id="htmlInput" spellcheck="false" oninput="load()"></textarea>
        <textarea class="input hidden" id="cssInput" spellcheck="false" oninput="load()"></textarea>
        <textarea class="input hidden" id="jsInput" spellcheck="false" oninput="load()"></textarea>

        <div style="width:100%; padding:4px; display:grid; grid-template-columns:1fr 200px;opacity:0.6">
            <div style="text-align:left;">
                <input type="radio" checked style="opacity:0.4;">
                Live
            </div>
            <div style="display:flex; flex-direction:row; flex-wrap:nowrap; gap:10px;">
                <div>⤓ Download</div>
                <div>↺ Reset</div>
            </div>
        </div>

        <iframe class="input" id="view" style="border:none;height: 30vh;border-radius: 0px 0px 6px 6px;"></iframe>
    </div>










    <!-- =========================================================
         KHU VỰC SOẠN CODE HỖ TRỢ
         ========================================================= -->
    <div id="control" style="display: none; background: white; 
        position: fixed; top:0px; left:0px; z-index:200; 
        height:100vh; width:100%; overflow-y:scroll; padding:8px;box-sizing: border-box;">
        <div style="padding-top:12px; display:grid; grid-template-columns:minmax(0, 1fr); 
            grid-template-rows:32px 24px 30vh auto auto; min-height:96vh; min-width:0;">
            <div class="run-area">                
                <div id="input_caption_div" style="position: fixed; top:0px; left: 0px; display: none;width:95vw;">
                    <textarea class="input" style="padding:8px;"
                        id="input_caption"><span style="font-weight: bold;">HTML code</span></textarea><br>
                    <button onclick="document.getElementById('input_caption_div').style.display='none';">x</button>
                </div>
                <button class="button" id="caption" onclick="document.getElementById('input_caption_div').style.display='block';">
                    Caption
                </button>
                <button class="button" id="clear">
                    Clear
                </button>
                <button class="button" id="close" onclick="document.getElementById('control').style.display='none';">
                    Close
                </button>
            </div>

            <div style="width:100%; padding:4px; display:flex; flex-direction:row; flex-wrap:nowrap; gap:10px;">
                <div class="tab__button tab__button-active" id="htmlButton2" onclick="showTab2('html')">
                    <div style="width:10px; height:10px; background:orange;"></div>
                    HTML
                </div>
                <div class="tab__button" id="cssButton2" onclick="showTab2('css')">
                    <div style="width:10px; height:10px; background:green;"></div>
                    CSS
                </div>
                <div class="tab__button" id="jsButton2" onclick="showTab2('js')">
                    <div style="width:10px; height:10px; background:red;"></div>
                    JS
                </div>
            </div>
            <div id="control2">
                <textarea class="input" style="width: 95%;" id="htmlInput2" spellcheck="false"></textarea>
                <textarea class="input hidden" style="width: 95%;" id="cssInput2" spellcheck="false"></textarea>
                <textarea class="input hidden" style="width: 95%;" id="jsInput2" spellcheck="false"></textarea>
            </div>
            <div class="editor-key-row" aria-label="Editor keys" id="control_shortKey">                
                <button class="button editor-key" onclick="insertEditorText('&lt;')" aria-label="Insert less-than">&lt;</button>
                <button class="button editor-key" onclick="insertEditorText('&gt;')" aria-label="Insert greater-than">&gt;</button>
                <button class="button editor-key" onclick="insertEditorText('{')" aria-label="Insert opening brace">{</button>
                <button class="button editor-key" onclick="insertEditorText('}')" aria-label="Insert closing brace">}</button>
                <button class="button editor-key" onclick="insertEditorText('=')" aria-label="Insert closing brace">=</button>
                <button class="button editor-key" onclick="insertEditorText('&quot;')" aria-label="Insert closing brace">"</button>

                <button class="button editor-key-tab" style="grid-column: 1 / span 2;" onclick="insertTab()" aria-label="Insert tab">↦ Tab</button>                
                <button class="button editor-key" onclick="insertEditorText(';')" aria-label="Insert semicolon">;</button>
                <button class="button editor-key" onclick="insertEditorText('/')" aria-label="Insert semicolon">/</button>
                <button class="button editor-key" onclick="insertEditorText('[')" aria-label="Insert opening bracket">[</button>
                <button class="button editor-key" onclick="insertEditorText(']')" aria-label="Insert closing bracket">]</button>                                        
            </div>
            
            <div class="component-area">
                <div style="display:flex; flex-direction:row;">                
                    <audio id="music" controls style="height:30px;"></audio>                
                </div>
                <script src="index_files/clock.js"></script>

                <div style="display:flex; flex-direction:row;">
                    <div class="control">
                        <select id="fontSizeControl" class="button" onchange="changeFontSize()">
                            <option value="xxs">Supper Small</option> 
                            <option value="xs">Very Small</option>                      
                            <option value="small" selected>Small</option>
                            <option value="medium">Medium</option>
                            <option value="larger">Larger</option>
                            <option value="xl">Extra larger</option>
                            <option value="xxl">Supper larger</option>
                        </select>
                    </div>

                    <div class="control">
                        <select id="speedControl" class="button" onchange="changeSpeed_select()">   
                            <option value="-">Custom</option>                     
                            <option value="slow">Slow</option>
                            <option value="medium" selected>Medium</option>
                            <option value="fast">Fast</option>
                            <option value="veryFast">Very fast</option>                        
                            <option value="supperFast">Supper fast</option>
                            <option value="ssFast">SS fast</option>
                        </select>
                        <input type="text" value="1" class="button"  onchange="changeSpeed_text()" id="speed_heSo" style="width:30px;">
                    </div>
                </div>
                <div class="run-area">        
                    <button id="music_play" class="button button__shadow"" style="width:80px;" onclick="playRandomMusic();">
                        Play
                    </button>

                    <button id="run" class="button button__shadow" style="width:100px;">
                        Run
                    </button>
                    <button id="runTest" class="button button__shadow" style="width:100px;">
                        Run test
                    </button>
                </div>
            </div>       

            <div class="component-area">
                <button class="button" onclick="addComponent('button')">+ Button</button>
                <button class="button" onclick="addComponent('image')">+ Image</button>
                <button class="button" onclick="addComponent('select')">+ Select</button>
                <button class="button" onclick="addComponent('input')">+ Input</button>
                <button class="button" onclick="addComponent('textarea')">+ Textarea</button>
                <button class="button" onclick="addComponent('checkbox')">+ Checkbox</button>
                <button class="button" onclick="addComponent('radio')">+ Radio</button>
                <button class="button" onclick="addComponent('table')">+ Table</button>
                <button class="button" onclick="addComponent('card')">+ Card</button>
                <button class="button" onclick="addComponent('container')">+ Container</button>
                <button class="button" onclick="addComponent('form')">+ Form</button>
                <button class="button" onclick="addComponent('link')">+ Link</button>
                <button class="button" onclick="addComponent('icon')">+ Icon</button>
                <button class="button" onclick="addComponent('h1')">+ h1</button>
                <button class="button" onclick="addComponent('h2')">+ h2</button>
            </div>
            
            
            <div style="width:100%; padding:4px; display:flex; flex-direction:row; flex-wrap:nowrap; gap:10px;margin-top: 12px;">
                <div class="tab__button tab__button-active" id="htmlButton3" onclick="showTab3('html')">
                    <div style="width:10px; height:10px; background:orange;"></div>
                    HTML
                </div>
                <div class="tab__button" id="cssButton3" onclick="showTab3('css')">
                    <div style="width:10px; height:10px; background:green;"></div>
                    CSS
                </div>
                <div class="tab__button" id="jsButton3" onclick="showTab3('js')">
                    <div style="width:10px; height:10px; background:red;"></div>
                    JS
                </div>
            </div>
            <!-- INPUT3 -->
            <textarea class="input" style="width: 95%;" id="htmlInput3" spellcheck="false"></textarea>
            <textarea class="input hidden" style="width: 95%;" id="cssInput3" spellcheck="false"></textarea>
            <textarea class="input hidden" style="width: 95%;" id="jsInput3" spellcheck="false"></textarea>
            

            <div class="component-area">
                <button class="button" id="changeHTMLBackground_button" onclick="changeHTMLBackground();">window background</button>
                <button class="button" id="changeViewBackgroundBlack_button" onclick="changeViewBackgroundBlack();">view background</button>
            </div>

            <div class="run-area">
                <button class="button" onclick="document.getElementById('control').style.display='none';">
                    Close
                </button>
            </div>
        </div>
    </div>
    <script src="index_files/music.js"></script>
    <script src="index_files/avatar.js"></script>
    <script src="index_files/control.js"></script>
    <script src="index_files/view.js"></script>    
    <script src="index_files/components.js"></script>
    <script src="index_files/run.js"></script>
    <script>
        var htmlBackgroundIndex = 0;
        const colorList = [{background: 'rgba(0,0,0,0.05)', color: 'black'},
            {background: 'black', color: 'white'}
        ];

        function changeHTMLBackground()
        {
            if (htmlBackgroundIndex < colorList.length -1)
            {
                htmlBackgroundIndex++;                
            }
            else
            {
                htmlBackgroundIndex = 0;
            }
            document.body.style.backgroundColor = colorList[htmlBackgroundIndex].background;
            document.body.style.color = colorList[htmlBackgroundIndex].color;
            document.getElementById('changeHTMLBackground_button').style.backgroundColor = colorList[htmlBackgroundIndex].background;
            document.getElementById('changeHTMLBackground_button').style.color = colorList[htmlBackgroundIndex].color;
        }

        var viewDefaultBackground = 'white';
        function changeViewBackgroundBlack()
        {
            let cssBl = 
`body
{
    background:black;
    color:white;
    font-size:20px;
}`;

            if (viewDefaultBackground == 'white')
            {
                viewDefaultBackground = 'black';
                document.getElementById('cssInput3').value += cssBl;

                document.getElementById('changeViewBackgroundBlack_button').style.backgroundColor = 'black';
                document.getElementById('changeViewBackgroundBlack_button').style.color = 'white';
            }
            else
            {
                viewDefaultBackground = 'white';                
                document.getElementById('cssInput3').value = document.getElementById('cssInput3').value.replace(cssBl, '');
                document.getElementById('changeViewBackgroundBlack_button').style.backgroundColor = 'white';
                document.getElementById('changeViewBackgroundBlack_button').style.color = 'black';
            }
        }
    </script>
</body>
</html>
